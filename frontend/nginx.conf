server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public landing pages are server-rendered HTML from the backend so that
    # Facebook/Zalo/Google crawlers — which do not run JavaScript — see real
    # <title>, og: tags and content instead of the SPA's empty shell.
    location /book/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: let react-router handle client-side routes (including /chat/*).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
